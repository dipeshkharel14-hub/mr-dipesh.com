<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexFrame Optical</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .hero-section { background: #f8f9fa; padding: 100px 0; text-align: center; }
        .feature-box { padding: 40px; border-radius: 10px; transition: 0.3s; }
        .feature-box:hover { box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">FLEXFRAME</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="#">Home</a>
                <a class="nav-link" href="#">Products</a>
            </div>
        </div>
    </nav>

    <header class="hero-section">
        <div class="container">
            <h1 class="display-4 fw-bold">Clear Vision, Better Life</h1>
            <p class="lead">Premium eyewear for the modern generation.</p>
            <button class="btn btn-primary btn-lg">Shop Now</button>
        </div>
    </header>

    <section class="container my-5">
        <div class="row text-center">
            <div class="col-md-4">
                <div class="feature-box border">
                    <h3>Frames</h3>
                    <p>Latest collections for 2026.</p>
                </div>
            </div>
            </div>
    </section>
