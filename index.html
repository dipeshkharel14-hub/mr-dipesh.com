<!DOCTYPE html>
<html>
<head>
    <title>Flappy Dipesh</title>
    <style>
        body { margin: 0; overflow: hidden; background: #70c5ce; font-family: sans-serif; text-align: center; }
        canvas { display: block; margin: 20px auto; border: 5px solid #fff; background: #fff; }
        h1 { color: white; text-shadow: 2px 2px #000; }
    </style>
</head>
<body>
    <h1>MR. DIPESH GAME</h1>
    <canvas id="gameCanvas" width="320" height="480"></canvas>
    <p>Press <b>Space</b> or <b>Tap</b> to Jump!</p>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // GAME SETTINGS
        let bird = { x: 50, y: 150, width: 40, height: 40, gravity: 0.6, lift: -10, velocity: 0 };
        let pipes = [];
        let score = 0;
        let frame = 0;

        // CUSTOM HEAD IMAGE
        const headImg = new Image();
        // REPLACE THIS URL with your photo link later
        headImg.src = 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png'; 

        function drawBird() {
            ctx.save();
            ctx.beginPath();
            ctx.arc(bird.x + 20, bird.y + 20, 20, 0, Math.PI * 2);
            ctx.closePath();
            ctx.clip();
            ctx.drawImage(headImg, bird.x, bird.y, bird.width, bird.height);
            ctx.restore();
        }

        function update() {
            bird.velocity += bird.gravity;
            bird.y += bird.velocity;

            if (frame % 90 === 0) {
                let pipeHeight = Math.random() * (canvas.height / 2);
                pipes.push({ x: canvas.width, top: pipeHeight, bottom: canvas.height - pipeHeight - 120 });
            }

            for (let i = pipes.length - 1; i >= 0; i--) {
                pipes[i].x -= 2;
                // Collision
                if (bird.x < pipes[i].x + 50 && bird.x + bird.width > pipes[i].x &&
                    (bird.y < pipes[i].top || bird.y + bird.height > canvas.height - pipes[i].bottom)) {
                    reset();
                }
                if (pipes[i].x + 50 < 0) {
                    pipes.splice(i, 1);
                    score++;
                }
            }

            if (bird.y > canvas.height || bird.y < 0) reset();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBird();
            ctx.fillStyle = "#2ecc71";
            pipes.forEach(p => {
                ctx.fillRect(p.x, 0, 50, p.top);
                ctx.fillRect(p.x, canvas.height - p.bottom, 50, p.bottom);
            });
            ctx.fillStyle = "#000";
            ctx.font = "20px Arial";
            ctx.fillText("Score: " + score, 10, 25);
        }

        function reset() {
            bird.y = 150; bird.velocity = 0; pipes = []; score = 0;
        }

        window.addEventListener('keydown', (e) => { if(e.code === 'Space') bird.velocity = bird.lift; });
        canvas.addEventListener('touchstart', () => bird.velocity = bird.lift);

        function loop() {
            update(); draw(); frame++;
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
